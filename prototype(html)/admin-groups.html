<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Groups — eDMS</title>
<script>(function(){try{document.documentElement.setAttribute('data-theme', localStorage.getItem('edms-theme')||'default');}catch(e){}})();</script>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="admin-groups">
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar"><div id="sidebarRoot"></div></aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div class="app-content">
    <div id="topbarRoot"></div>
    <main class="app-main" id="appMain">

      <div class="breadcrumb mb-3"><a href="admin-users.html">Admin Center</a><svg class="icon icon-sm sep" data-icon="chevronRight"></svg><span class="current">Groups</span></div>
      <div class="page-header">
        <div><div class="page-title">Groups</div><div class="page-subtitle">Site-managed groups and organization-wide custom groups.</div></div>
        <div class="page-actions"><button class="btn btn-primary" data-dialog-trigger="createGroupDialog"><svg class="icon icon-sm" data-icon="userPlus"></svg>Create group</button></div>
      </div>

      <div class="pill-tabs mb-4">
        <a class="pill-tab" href="admin-users.html">Users</a>
        <a class="pill-tab active" href="admin-groups.html">Groups</a>
        <a class="pill-tab" href="admin-sites.html">Sites</a>
        <a class="pill-tab" href="admin-storage.html">Storage report</a>
        <a class="pill-tab" href="admin-audit-log.html">Audit log</a>
        <a class="pill-tab" href="admin-settings.html">Settings</a>
      </div>

      <div class="card">
        <div class="card-content tight">
          <div class="table-wrap" style="border:none;border-radius:0;">
            <table class="data-table">
              <thead><tr><th>Group</th><th>Type</th><th>Scope</th><th>Members</th><th class="actions-col"></th></tr></thead>
              <tbody id="adminGroupsBody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div class="overlay" id="createGroupDialog">
  <div class="dialog">
    <div class="dialog-header"><div class="dialog-title">Create group<button class="dialog-close btn btn-icon btn-ghost btn-sm" data-dialog-close><svg class="icon" data-icon="x"></svg></button></div><div class="dialog-description">Custom groups can be granted access to any site, library, folder, or document.</div></div>
    <form id="createGroupForm">
      <div class="dialog-body">
        <div class="field"><label class="label">Group name <span class="req">*</span></label><input class="input" id="newGroupName" required></div>
        <div class="field"><label class="label">Description</label><textarea class="textarea" rows="2"></textarea></div>
      </div>
      <div class="dialog-footer"><button type="button" class="btn btn-secondary" data-dialog-close>Cancel</button><button type="submit" class="btn btn-primary">Create</button></div>
    </form>
  </div>
</div>

<div class="overlay" id="manageGroupDialog">
  <div class="dialog">
    <div class="dialog-header"><div class="dialog-title"><span id="manageGroupName">Group</span><button class="dialog-close btn btn-icon btn-ghost btn-sm" data-dialog-close><svg class="icon" data-icon="x"></svg></button></div><div class="dialog-description">Members of this group</div></div>
    <div class="dialog-body">
      <div id="manageGroupMembers"></div>
      <div class="field mt-3"><label class="label">Add member</label><div class="input-icon-wrap"><svg class="icon icon-sm" data-icon="userPlus"></svg><input class="input" placeholder="Search by name or email…"></div></div>
    </div>
    <div class="dialog-footer"><button class="btn btn-secondary" data-dialog-close>Close</button><button class="btn btn-primary" id="saveGroupMembersBtn">Save</button></div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
  qs("#saveGroupMembersBtn").addEventListener("click", function () { closeDialog(qs("#manageGroupDialog")); showToast({ title: "Group membership updated" }); });
</script>
</body>
</html>
