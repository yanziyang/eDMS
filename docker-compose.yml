services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edms}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  office-converter:
    image: ${OFFICE_CONVERTER_IMAGE:-edms-office-converter:local}
    build: ./server/LibreOfficeServer
    ports:
      - "8100:8100"
    environment:
      # LibreOffice needs a writable HOME for its profile
      HOME: /tmp
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  text-extractor:
    image: apache/tika:3.2.3.0-full
    ports:
      - "9998:9998"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9998/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  mock-oauth2-server:
    # Test/demo only. Never use this provider in a production deployment.
    image: ghcr.io/navikt/mock-oauth2-server:4.0.0
    hostname: host.docker.internal
    ports:
      - "4011:8080"
    environment:
      # The provider accepts the client/redirect requested by the test app;
      # these values mirror the Oidc:* settings below and .env.example.
      JSON_CONFIG: >-
        {
          "interactiveLogin": true,
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "requestMappings": [
                {
                  "requestParam": "code",
                  "match": "*",
                  "claims": {
                    "sub": "oidc-demo-user",
                    "aud": ["edms-demo-client"],
                    "email": "demo-user@edms.local",
                    "email_verified": true,
                    "name": "OIDC Demo User",
                    "preferred_username": "demo-user"
                  }
                }
              ]
            }
          ]
        }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/isalive"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  saml-idp:
    # Test/demo only. Never use this provider in a production deployment.
    image: cirrusid/simplesamlphp:v2.5.0
    entrypoint: ["bash", "/opt/edms-saml/entrypoint.sh"]
    environment:
      SSP_ADMIN_PASSWORD: ${SAML_IDP_ADMIN_PASSWORD:-secret1}
      SSP_SECRET_SALT: ${SAML_IDP_SECRET_SALT:-edms-saml-demo-secret}
      SSP_APACHE_ALIAS: simplesaml/
      APACHE_CERT_NAME: local-stack-dev
    volumes:
      - ./docker/saml-idp:/opt/edms-saml:ro
      - saml-certs:/shared
    ports:
      - "4443:443"
    healthcheck:
      test: ["CMD-SHELL", "curl -k -fsS https://127.0.0.1/simplesaml/saml2/idp/metadata.php > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  api:
    image: ${API_IMAGE:-edms-api:local}
    build: ./server
    environment:
      Database__Provider: "Postgres"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-edms};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-devonly}"
      OfficeConversion__BaseUrl: "http://office-converter:8100"
      TextExtraction__BaseUrl: "http://text-extractor:9998"
      Oidc__Authority: "${OIDC_AUTHORITY:-http://host.docker.internal:4011/default}"
      Oidc__ClientId: "${OIDC_CLIENT_ID:-edms-demo-client}"
      Oidc__ClientSecret: "${OIDC_CLIENT_SECRET:-edms-demo-secret}"
      Oidc__CallbackPath: "${OIDC_CALLBACK_PATH:-/api/v1/auth/sso/oidc/callback}"
      Oidc__RequireHttpsMetadata: "${OIDC_REQUIRE_HTTPS_METADATA:-false}"
      Saml__IdpEntityId: "${SAML_IDP_ENTITY_ID:-urn:edms:test-saml-idp}"
      Saml__IdpSingleSignOnUrl: "${SAML_IDP_SSO_URL:-https://localhost:4443/simplesaml/saml2/idp/SSOService.php}"
      Saml__IdpSigningCertificate: "${SAML_IDP_SIGNING_CERT_PATH:-/run/saml/server.crt}"
      Saml__SigningCertificate: "${SAML_SP_SIGNING_CERT_PATH:-}"
      Saml__SigningCertificatePassword: "${SAML_SP_SIGNING_CERT_PASSWORD:-}"
      Saml__SignAuthnRequest: "${SAML_SIGN_AUTHN_REQUEST:-false}"
      Saml__EntityId: "${SAML_ENTITY_ID:-urn:edms:saml}"
      Saml__CallbackPath: "${SAML_CALLBACK_PATH:-/api/v1/auth/sso/saml/acs}"
      Saml__MetadataPath: "${SAML_METADATA_PATH:-/api/v1/auth/sso/saml/metadata}"
      Saml__EmailAttributeName: "${SAML_EMAIL_ATTRIBUTE_NAME:-http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress}"
      Client__BaseUrl: "http://localhost:5173"
      Jwt__PrivateKey: ""
      Jwt__PublicKey: ""
      Seed__AdminEmail: "admin@edms.local"
      Seed__AdminTempPassword: "ChangeMe123!"
      Smtp__Host: mailhog
      Smtp__Port: "1025"
    ports:
      - "5080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      office-converter:
        condition: service_healthy
      text-extractor:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_healthy
      saml-idp:
        condition: service_healthy
    volumes:
      - saml-certs:/run/saml:ro
      # Production/staging writes certificate material here from the deploy
      # secret manager. The local directory is gitignored and optional.
      - ${SAML_SECRETS_DIR:-./.secrets/saml}:/run/saml-secrets:ro

  web:
    image: ${WEB_IMAGE:-edms-web:local}
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: "http://localhost:5080/api/v1"
        VITE_APP_NAME: eDMS
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  saml-certs:
