services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: edms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devonly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edms"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  office-converter:
    image: ${OFFICE_CONVERTER_IMAGE:-edms-office-converter:local}
    build: ./server/LibreOfficeServer
    ports:
      - "8100:8100"
    environment:
      # LibreOffice needs a writable HOME for its profile
      HOME: /tmp
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  text-extractor:
    image: apache/tika:3.2.3.0-full
    ports:
      - "9998:9998"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9998/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      Database__Provider: "Postgres"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=edms;Username=postgres;Password=devonly"
      OfficeConversion__BaseUrl: "http://office-converter:8100"
      TextExtraction__BaseUrl: "http://text-extractor:9998"
      Jwt__PrivateKey: ""
      Jwt__PublicKey: ""
      Seed__AdminEmail: "admin@edms.local"
      Seed__AdminTempPassword: "ChangeMe123!"
      Smtp__Host: mailhog
      Smtp__Port: "1025"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
      office-converter:
        condition: service_healthy
      text-extractor:
        condition: service_healthy

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: "http://localhost:5080/api/v1"
        VITE_APP_NAME: eDMS
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
