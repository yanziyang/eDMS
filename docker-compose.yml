services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: edms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devonly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  office-converter:
    build: ./server/LibreOfficeServer
    ports:
      - "8100:8100"
    environment:
      # LibreOffice needs a writable HOME for its profile
      HOME: /tmp

  text-extractor:
    image: apache/tika:3.2.3.0-full
    ports:
      - "9998:9998"

  api:
    build: ./server
    environment:
      Database__Provider: "Postgres"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=edms;Username=postgres;Password=devonly"
      OfficeConversion__BaseUrl: "http://office-converter:8100"
      TextExtraction__BaseUrl: "http://text-extractor:9998"
      Jwt__PrivateKey: ""
      Jwt__PublicKey: ""
      Seed__AdminEmail: "admin@edms.local"
      Seed__AdminTempPassword: "ChangeMe123!"
      Smtp__Host: mailhog
      Smtp__Port: "1025"
    ports:
      - "5080:8080"
    depends_on:
      - postgres
      - mailhog
      - office-converter
      - text-extractor

  web:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: "http://localhost:5080/api/v1"
        VITE_APP_NAME: eDMS
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
