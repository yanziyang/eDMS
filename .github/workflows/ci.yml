name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore server/eDMS.sln
      - run: dotnet build server/eDMS.sln --no-restore --configuration Release
      - run: dotnet test server/eDMS.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --settings server/coverlet.runsettings

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run test:coverage
        working-directory: client
